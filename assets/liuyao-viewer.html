<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fortune 六爻占问案卷</title>
  <style>
    :root{--canvas:#eff1f2;--paper:#fbfbfa;--ink:#20262a;--muted:#747b80;--line:#dfe3e5;--soft:#f2f4f4;--verm:#c65d47;--verm-soft:#f6e9e5;--jade:#526b62;--gold:#b58b47}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#fff 0,transparent 35%),var(--canvas);color:var(--ink);font-family:Inter,"PingFang SC","Noto Sans SC",system-ui,sans-serif;min-height:100vh}
    .page{width:min(1160px,calc(100% - 32px));margin:auto;padding:42px 0 72px}.mast{display:flex;justify-content:space-between;align-items:flex-start}.kicker{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--jade)}h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(32px,5vw,58px);font-weight:500;letter-spacing:.06em;margin:10px 0 8px}.subtitle{color:var(--muted);font-size:14px}.brand{position:relative;display:flex;align-items:baseline;gap:9px}.brand span{font:700 italic 34px/1 "Segoe Script","Brush Script MT",cursive;letter-spacing:-3px}.brand em{font-style:normal;font-size:14px;letter-spacing:.18em}.brand:after{content:"";position:absolute;left:2px;bottom:-10px;width:138px;height:3px;border-radius:99px;background:var(--verm)}
    .case{margin-top:28px;background:var(--paper);border:1px solid #d9dddf;border-radius:24px;box-shadow:0 24px 70px rgba(30,40,46,.09);overflow:hidden}.case-top{padding:26px 30px 22px;border-bottom:1px solid var(--line)}.question-label{color:var(--verm);font-size:12px;font-weight:800;letter-spacing:.14em}.question{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(22px,3vw,34px);margin-top:7px}.info-grid{display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.info{padding:13px 15px;background:white;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:68px}.info:nth-child(4n){border-right:0}.info:nth-last-child(-n+4){border-bottom:0}.info b{display:block;color:var(--gold);font-size:11px;letter-spacing:.12em;margin-bottom:5px}.info span{font-size:14px;line-height:1.45}.info.wide{grid-column:span 2}
    .hex-head{display:grid;grid-template-columns:1fr 52px 1fr;align-items:center;padding:26px 30px 18px}.hex-title{text-align:center}.hex-title strong{display:block;font-family:"Noto Serif SC","Songti SC",serif;font-size:28px;font-weight:600}.hex-title span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.transition{text-align:center;color:var(--verm);font-family:serif;font-size:24px}.status-bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 22px 22px}.pill{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
    .chart-shell{margin:0 24px 24px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.chart-labels,.line-row{display:grid;grid-template-columns:64px minmax(128px,1fr) 150px 72px 150px minmax(128px,1fr);gap:12px;align-items:center}.chart-labels{padding:10px 16px;color:var(--muted);font-size:11px;text-align:center;background:var(--soft);letter-spacing:.08em}.line-row{padding:12px 16px;border-top:1px solid var(--line);min-height:74px}.line-row.moving{background:linear-gradient(90deg,transparent,var(--verm-soft),transparent)}.spirit{font-size:13px;color:var(--muted)}.relation{text-align:right}.relation.changed-rel{text-align:left}.relation strong{display:block;font-size:15px}.relation small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.glyph{display:flex;justify-content:center}.yang,.yin i{height:10px;border-radius:6px;background:var(--ink);display:block}.yang{width:128px}.yin{width:128px;display:flex;gap:20px}.yin i{width:54px}.changed-glyph .yang,.changed-glyph .yin i{background:#5e686e}.moving .glyph:first-of-type .yang,.moving .glyph:first-of-type .yin i{background:var(--verm)}.marks{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}.mark{font-size:10px;font-weight:800;padding:4px 6px;border-radius:5px;background:#e8ecea;color:var(--jade)}.mark.move{background:var(--verm-soft);color:var(--verm)}.mark.alert{background:#f5eee0;color:#8b692e}.changed-note{font-size:10px;color:var(--muted);margin-top:4px}.hidden{grid-column:2/7;padding:8px 12px;border-radius:8px;background:#faf3e9;color:#75592d;font-size:12px}.hidden b{color:var(--verm)}
    .fact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 24px 26px}.fact{padding:17px 18px;border-radius:13px;background:var(--soft);border-top:3px solid var(--jade)}.fact b{display:block;font-size:12px;margin-bottom:7px;letter-spacing:.08em}.fact span{font-size:13px;line-height:1.6;color:var(--muted)}.audit-note{margin:0 24px 28px;padding:14px 16px;border-left:3px solid var(--verm);background:var(--verm-soft);font-size:12px;color:#6f4b42}.loader{padding:22px 26px;margin-top:18px;background:#fff;border:1px dashed var(--line);border-radius:16px;font-size:14px}.loader input{margin-top:10px}
    @media(max-width:780px){.page{width:100%;padding:0 0 40px}.mast{padding:24px 18px 18px}.brand{display:none}.case{margin:0;border-radius:0;border-left:0;border-right:0;box-shadow:none}.case-top{padding:20px 16px}.info-grid{grid-template-columns:repeat(2,1fr)}.info:nth-child(n){border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.info:nth-child(2n){border-right:0}.info:nth-last-child(-n+2){border-bottom:0}.hex-head{padding:22px 14px 14px;grid-template-columns:1fr 34px 1fr}.hex-title strong{font-size:21px}.chart-shell{margin:0 10px 18px}.chart-labels{grid-template-columns:42px 91px 86px 48px 86px 91px;gap:3px;padding:9px 5px;font-size:9px}.line-row{grid-template-columns:42px 91px 86px 48px 86px 91px;gap:3px;padding:10px 5px;min-height:70px}.spirit{font-size:11px}.relation strong{font-size:12px}.relation small{font-size:9px}.yang,.yin{width:78px}.yin{gap:14px}.yin i{width:32px}.yang,.yin i{height:8px}.mark{padding:3px 4px;font-size:9px}.hidden{grid-column:2/7;font-size:10px}.fact-grid{grid-template-columns:1fr;padding:0 12px 18px}.audit-note{margin:0 12px 22px}.status-bar{padding-bottom:16px}}
    @media(max-width:470px){.chart-shell{overflow-x:auto}.chart-labels,.line-row{min-width:540px}.info span{font-size:12px}.question{font-size:23px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="mast"><div><div class="kicker">文王纳甲 · 三钱成卦 · 规则成盘</div><h1>六爻占问案卷</h1><div class="subtitle">盘面事实完整呈现，判断与排盘分层保留。</div></div><div class="brand"><span>Fortune</span><em>六爻</em></div></header>
    <section id="viewer"></section>
    <section class="loader" id="loader">选择排盘 JSON 预览卦面：<br><input id="file" type="file" accept="application/json,.json" /></section>
  </main>
  <script>
    const EMBEDDED_JSON="__LIUYAO_DATA__";
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const relationName=v=>({same_element:"比和",generates_original:"回头生",controls_original:"回头克",other:"动变",advance:"化进",retreat:"化退",none:""}[v]||v||"");
    const methodName=v=>({auto:"自动起卦",manual_coins:"三枚硬币手动起卦",agent_recorded:"Agent 逐次记录",specified_lines:"指定六爻值"}[v]||v||"指定六爻值");
    const patternName=v=>({ordinary:"常规卦",six_clash:"六冲卦",six_harmony:"六合卦"}[v]||v||"常规卦");
    function glyph(yinYang){return yinYang==="阳"?'<span class="yang"></span>':'<span class="yin"><i></i><i></i></span>'}
    function formatTime(v){if(!v)return"未记录";try{return new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(v))}catch{return v}}
    function hiddenFor(c,pos){return(c.hiddenLines||[]).filter(x=>x.position===pos).map(x=>`<div class="hidden"><b>伏神</b> ${esc(x.sixRelative)} ${esc(x.najiaStem)}${esc(x.najiaBranch)}${esc(x.najiaElement)} · 飞神 ${esc(x.flyingSixRelative)} ${esc(x.flyingStem)}${esc(x.flyingBranch)}</div>`).join("")}
    function render(data){
      const c=data.chart||data,a=data.analysis||data.deterministicRuleFacts||{},cal=data.calendar||{},casting=data.castingAudit||{};
      const q=a.questionContext?.question||"未记录问题";
      const rows=[...(c.lines||[])].reverse().map(l=>{const changed=l.changedLine;return `<div class="line-row ${l.moving?'moving':''}"><div class="spirit">${esc(l.sixSpirit)}</div><div class="relation"><strong>${esc(l.sixRelative)}</strong><small>${esc(l.najiaStem)}${esc(l.najiaBranch)} · ${esc(l.najiaElement)}</small></div><div class="glyph">${glyph(l.yinYang)}</div><div class="marks">${l.isShi?'<span class="mark">世</span>':''}${l.isYing?'<span class="mark">应</span>':''}${l.moving?'<span class="mark move">动</span>':''}${l.isVoid?'<span class="mark alert">空</span>':''}${l.isMonthBreak?'<span class="mark alert">月破</span>':''}${l.isDayClash?'<span class="mark alert">日冲</span>':''}</div><div class="glyph changed-glyph">${glyph(l.changedYinYang)}</div><div class="relation changed-rel">${changed?`<strong>${esc(changed.sixRelative)}</strong><small>${esc(changed.najiaStem)}${esc(changed.najiaBranch)} · ${esc(changed.najiaElement)}</small><div class="changed-note">${esc(relationName(changed.returnRelation))} ${esc(relationName(changed.advanceRetreat))}${changed.isVoid?' · 变爻空':''}</div>`:'<span style="color:var(--muted)">静爻沿用</span>'}</div>${hiddenFor(c,l.position)}</div>`}).join("");
      const candidates=(a.candidates||[]).map(x=>`${x.hidden?'伏神':'第'+x.position+'爻'} ${x.sixRelative}${x.najiaStem||''}${x.najiaBranch||''}${x.isVoid?'（空）':''}${x.isMonthBreak?'（月破）':''}`).join('；')||'需结合问题确认';
      const terms=cal.solarTermWindow?`${cal.solarTermWindow.previous.name} ${cal.solarTermWindow.previous.date} → ${cal.solarTermWindow.next.name} ${cal.solarTermWindow.next.date}`:'未提供节气窗口';
      const ganzhi=[cal.yearGanzhi&&cal.yearGanzhi+'年',cal.monthGanzhi&&cal.monthGanzhi+'月',c.dayGanzhi&&c.dayGanzhi+'日',cal.timeGanzhi&&cal.timeGanzhi+'时'].filter(Boolean).join(' · ');
      document.querySelector('#viewer').innerHTML=`<article class="case"><section class="case-top"><div class="question-label">所问事项</div><div class="question">${esc(q)}</div><div class="info-grid"><div class="info wide"><b>起卦时间</b><span>${esc(formatTime(c.castAt))}<br>${esc(cal.lunarDateText||'')}</span></div><div class="info"><b>起卦方式</b><span>${esc(methodName(casting.method))}</span></div><div class="info"><b>爻序</b><span>初爻 → 上爻<br>${esc((casting.linesBottomUp||[]).join(' · '))}</span></div><div class="info wide"><b>干支</b><span>${esc(ganzhi||c.dayGanzhi+'日')}</span></div><div class="info wide"><b>节气</b><span>${esc(terms)}</span></div><div class="info"><b>月建 / 日辰</b><span>${esc(c.monthBranch)}月 · ${esc(c.dayGanzhi)}日</span></div><div class="info"><b>旬空</b><span>${esc((c.voidBranches||[]).join('、')||'无')}</span></div><div class="info"><b>卦宫</b><span>${esc(c.palace)}宫 · ${esc(c.palaceElement)}<br>${esc(c.palaceStage)}</span></div><div class="info"><b>世 / 应</b><span>世${esc(c.shiPosition)} · 应${esc(c.yingPosition)}</span></div></div></section><section class="hex-head"><div class="hex-title"><strong>${esc(c.originalHexagram?.name)}</strong><span>本卦 · ${esc(patternName(c.originalHexagramPattern))}</span></div><div class="transition">之</div><div class="hex-title"><strong>${esc(c.changedHexagram?.name)}</strong><span>变卦 · ${esc(patternName(c.changedHexagramPattern))}</span></div></section><div class="status-bar"><span class="pill">${esc(c.schoolProfile||'wenwang_najia_v1')}</span><span class="pill">规则 ${esc(c.transformationRuleVersion||'v1')}</span><span class="pill">${(c.hiddenLines||[]).length} 个伏神</span><span class="pill">${(c.lines||[]).filter(x=>x.moving).length} 个动爻</span></div><section class="chart-shell"><div class="chart-labels"><span>六神</span><span>本卦纳甲</span><span>本卦爻象</span><span>标记</span><span>变卦爻象</span><span>变爻纳甲</span></div>${rows}</section><section class="fact-grid"><div class="fact"><b>用神主线</b><span>${esc(a.yongshenRelative||'待确认')}</span></div><div class="fact"><b>用神候选</b><span>${esc(candidates)}</span></div><div class="fact"><b>整体结构</b><span>${esc(patternName(c.originalHexagramPattern))} → ${esc(patternName(c.changedHexagramPattern))}；${esc(c.hexagramPatternTransition||'常规变化')}</span></div></section><div class="audit-note">卦面字段由本地规则引擎生成。六神、卦名和爻位类象用于辅助观察，不替代用神、世应、月日与动变主线。</div><div class="audit-note">本内容基于玄学体系生成，仅供文化爱好与思维参考，不构成任何重大人生决策的专业建议。</div></article>`;
    }
    const loader=document.querySelector('#loader');
    if(EMBEDDED_JSON.trim().startsWith('{')){try{render(JSON.parse(EMBEDDED_JSON));loader.hidden=true}catch(e){console.error(e)}}
    document.querySelector('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(f){render(JSON.parse(await f.text()));loader.hidden=true}});
  </script>
</body>
</html>
